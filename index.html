<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Avances del juego</title><style>@font-face{font-family:Patrick;src:url('fuentes/PatrickHand-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#e6dfd0;color:#1b2233;font:23px/1.5 Patrick,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,490px);background:#fbf8f1;border:1px solid #b6b1a8;padding:30px;box-shadow:3px 4px 0 #c9c2b5}h1{font-size:36px;font-weight:400;line-height:1.2;margin:0 0 27px;border-bottom:4px solid #ff7414;padding-bottom:8px}label{display:block}input[type=password],input[type=text]{font:21px Patrick,sans-serif;width:100%;padding:9px 12px;margin:7px 0 10px;background:#fffdf8;border:1px solid #1b2233;border-radius:0}.mostrar{font-size:20px;display:flex;align-items:center;gap:8px}button{font:24px Patrick,sans-serif;background:#ffb264;color:#1b2233;border:1px solid #1b2233;padding:8px 25px;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #1650f2;outline-offset:3px}#mensaje{font-size:20px;margin:16px 0 0;min-height:30px}noscript{display:block;margin-top:20px}</style><script src="desbloquear.js" defer></script></head><body><main><h1>Avances del juego</h1><form id="acceso"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required><label class="mostrar"><input type="checkbox" id="mostrar"> Mostrar contraseña</label><button type="submit">Entrar</button><p id="mensaje" role="status" aria-live="polite"></p></form><noscript>Activa JavaScript para abrir la página.</noscript></main></body></html>
